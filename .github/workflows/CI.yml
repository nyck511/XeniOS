name: CI

on:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        env:
          LLVM_VERSION: 21
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-$LLVM_VERSION main"
          sudo apt-get -y update
          sudo apt-get -y install clang-format-$LLVM_VERSION
      - name: Lint
        run: ./xenia-build.py lint --all

  bootstrap-smoke:
    name: Bootstrap smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Initialize submodules
        run: .github/scripts/update-submodules.sh

      - name: Validate build bootstrap
        run: |
          python3 -m py_compile \
            xenia-build.py \
            tools/build/embed_bundle.py \
            tools/build/embed_binary_assets.py \
            tools/build/generate_metal_shaders.py
          ./xb --help
          ./xb slang --help
          ./xb buildshaders --help
          ./xb i18n --help
          ./xenia-build.py --help
          ./xenia-build.py slang --help
          ./xenia-build.py i18n --help
          test -f third_party/metal-shader-converter/lib_iOS/libmetalirconverter.dylib
          test -f src/xenia/gpu/metal/CMakeLists.txt
          test -f tools/build/embed_bundle.py
          python3 tools/build/generate_metal_shaders.py \
            --repository "$PWD" \
            --verify-manifest
          for forbidden_path in \
            src/xenia/gpu/metal/metal_backend_telemetry.cc \
            src/xenia/gpu/metal/metal_backend_telemetry.h \
            src/xenia/gpu/metal/metal_direct_host_resolve.cc \
            src/xenia/gpu/metal/metal_stage_compile_cache.cc \
            src/xenia/gpu/metal/metal_stage_compile_cache.h \
            src/xenia/gpu/metal/metal_zpd_visibility_pool.cc \
            src/xenia/gpu/metal/metal_zpd_visibility_pool.h; do
            test ! -e "$forbidden_path"
          done

      - name: Validate embedded font generation
        run: |
          set -euo pipefail
          test -f 'assets/font/Inter-VariableFont_opsz,wght.ttf'
          test -f assets/font/OFL.txt
          python3 tools/build/embed_binary_assets.py \
            --source-dir assets/font \
            --output-dir build/generated/xenia-ui \
            --namespace font
          test -f build/generated/xenia-ui/embedded_font.h
          test -f build/generated/xenia-ui/embedded_font.cc

          c++ \
            -std=c++20 \
            -Ibuild/generated/xenia-ui \
            build/generated/xenia-ui/embedded_font.cc \
            -x c++ - \
            -o /tmp/xenios-embedded-font-probe <<'CPP'
          #include "embedded_font.h"

          int main() {
            return
                xe::ui::embedded_font::
                        Inter_VariableFont_opsz_wght_ttf_size > 0 &&
                    xe::ui::embedded_font::kAllCount > 0
                ? 0
                : 1;
          }
          CPP
          /tmp/xenios-embedded-font-probe

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          paths = [
              Path("build/generated/xenia-ui/embedded_font.h"),
              Path("build/generated/xenia-ui/embedded_font.cc"),
          ]
          state = {
              str(path): {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "mtime_ns": path.stat().st_mtime_ns,
                  "size": path.stat().st_size,
              }
              for path in paths
          }
          Path("/tmp/xenios-font-state-before.json").write_text(
              json.dumps(state, indent=2),
              encoding="utf-8",
          )
          PY

          python3 tools/build/embed_binary_assets.py \
            --source-dir assets/font \
            --output-dir build/generated/xenia-ui \
            --namespace font

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          before = json.loads(
              Path("/tmp/xenios-font-state-before.json").read_text(
                  encoding="utf-8"
              )
          )
          for name, expected in before.items():
              path = Path(name)
              current = {
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "mtime_ns": path.stat().st_mtime_ns,
                  "size": path.stat().st_size,
              }
              if current != expected:
                  raise SystemExit(
                      f"Idempotence failure for {name}:\n"
                      f"before={expected}\nafter={current}"
                  )
          print("Second generation preserved hashes, sizes, and timestamps")
          PY

          test -z "$(
            git ls-files \
              build/generated/xenia-ui/embedded_font.h \
              build/generated/xenia-ui/embedded_font.cc
          )"
          ignored_count="$(
            git check-ignore \
              build/generated/xenia-ui/embedded_font.h \
              build/generated/xenia-ui/embedded_font.cc |
              wc -l |
              tr -d '[:space:]'
          )"
          test "$ignored_count" -eq 2

  shader-generation-smoke:
    name: iPhoneOS Metal shader generation
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: .github/scripts/update-submodules.sh

      - name: Select Xcode and validate Apple shader tools
        run: |
          developer_dir="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Default Xcode 27 developer directory not found"
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.'
          xcrun --sdk iphoneos --show-sdk-version | grep -q '^27\.'
          xcrun --sdk iphoneos --show-sdk-path
          if ! xcrun --find metal >/dev/null 2>&1 || \
             ! xcrun --find metallib >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
          xcrun --find metallib

      - name: Cache Slang 2026.8
        uses: actions/cache@v5
        with:
          path: .slang
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Provision Slang 2026.8
        run: |
          ./xb slang
          slangc="$(
            find .slang/2026.8 \
              -type f \
              -path '*/bin/slangc' \
              -print |
              head -n 1
          )"
          test -n "$slangc"
          chmod u+x "$slangc"
          test -x "$slangc"
          echo "SLANGC_PATH=$PWD/$slangc" >> "$GITHUB_ENV"
          "$slangc" -version || "$slangc" --version

      - name: Cache native shader compiler
        uses: actions/cache@v5
        with:
          path: |
            build/host-shader-tools
            build/host_tools/Release/xenia-shader-cc
          key: ${{ runner.os }}-${{ runner.arch }}-xenia-shader-cc-${{ hashFiles('cmake/HostShaderCompiler.cmake', 'tools/build/shader_cc/CMakeLists.txt', 'third_party/CMakeLists.txt', 'tools/build/shader_cc.cc', 'xenia-build.py', 'third_party/glslang/CHANGES.md', 'third_party/SPIRV-Tools/CHANGES') }}

      - name: Generate and validate iPhoneOS Metal headers
        env:
          XE_TARGET_IOS: "1"
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: |
          printf '[%s] Starting native host-tool build and 86-header generation\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ./xb buildshaders --target metal --target_os ios
          printf '[%s] Completed native host-tool build and 86-header generation\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          file build/host_tools/Release/xenia-shader-cc |
            grep 'Mach-O 64-bit executable arm64'
          header_count="$(
            find \
              build/generated/xenia/gpu/shaders/bytecode/metal \
              build/generated/xenia/ui/shaders/bytecode/metal \
              -type f -name '*.h' -print |
              wc -l |
              tr -d '[:space:]'
          )"
          test "$header_count" -eq 86

  build-ios-arm64:
    name: Build iOS ARM64
    needs:
      - bootstrap-smoke
      - shader-generation-smoke
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize submodules
        run: .github/scripts/update-submodules.sh

      - name: Build bootstrap smoke checks
        run: |
          python3 -m py_compile xb xenia-build.py
          ./xb --help
          ./xb slang --help
          ./xenia-build.py --help
          ./xenia-build.py slang --help
          test -f third_party/metal-shader-converter/lib_iOS/libmetalirconverter.dylib

      - name: Cache Slang 2026.8
        uses: actions/cache@v5
        with:
          path: .slang
          key: ${{ runner.os }}-${{ runner.arch }}-slang-2026.8

      - name: Provision Slang 2026.8
        run: |
          ./xb slang
          slangc="$(
            find .slang/2026.8 \
              -type f \
              -path '*/bin/slangc' \
              -print |
              head -n 1
          )"
          test -n "$slangc"
          chmod u+x "$slangc"
          test -x "$slangc"
          echo "SLANGC_PATH=$PWD/$slangc" >> "$GITHUB_ENV"
          "$slangc" -version || "$slangc" --version

      - name: Restore native shader compiler cache
        uses: actions/cache@v5
        with:
          path: |
            build/host-shader-tools
            build/host_tools/Release/xenia-shader-cc
          key: ${{ runner.os }}-${{ runner.arch }}-xenia-shader-cc-${{ hashFiles('cmake/HostShaderCompiler.cmake', 'tools/build/shader_cc/CMakeLists.txt', 'third_party/CMakeLists.txt', 'tools/build/shader_cc.cc', 'xenia-build.py', 'third_party/glslang/CHANGES.md', 'third_party/SPIRV-Tools/CHANGES') }}

      - name: Cache premake5
        id: cache-premake5
        uses: actions/cache@v5
        with:
          path: tools/build/bin/premake5
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-premake5-ios-${{ hashFiles('.gitmodules', 'xenia-build.py', 'tools/build/premake.py') }}

      - name: Cache build output
        id: cache-build-ios
        uses: actions/cache@v5
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27-ios-deriveddata-${{ hashFiles('src/**', 'premake5.lua', 'third_party/**/*.lua', 'assets/apple/**', 'xenia-build.py', 'tools/build/shader_cc.cc', 'tools/build/generate_metal_shaders.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode27-ios-deriveddata-

      - name: Setup
        env:
          XE_TARGET_IOS: "1"
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ $n -ge 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          developer_dir="/Applications/Xcode.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Default Xcode 27 developer directory not found"
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.'
          xcrun --sdk iphoneos --show-sdk-version | grep -q '^27\.'

          ensure_metal_toolchain() {
            if xcrun --find metal >/dev/null 2>&1 && xcrun --find metallib >/dev/null 2>&1; then
              xcrun --find metal
              xcrun --find metallib
              return 0
            fi

            echo "::notice::Installing Xcode MetalToolchain component"
            xcodebuild -showComponent MetalToolchain || true
            if ! retry xcodebuild -downloadComponent MetalToolchain; then
              retry sudo env DEVELOPER_DIR="$DEVELOPER_DIR" \
                xcodebuild -downloadComponent MetalToolchain
            fi
            xcodebuild -showComponent MetalToolchain || true

            if ! xcrun --find metal >/dev/null 2>&1 || ! xcrun --find metallib >/dev/null 2>&1; then
              echo "::error::Metal toolchain is still unavailable after installation"
              return 1
            fi

            xcrun --find metal
            xcrun --find metallib
          }

          ensure_metal_toolchain

          ensure_ios_platform() {
            if xcodebuild -showsdks | grep -qE '^[[:space:]]+iOS '; then
              xcodebuild -showsdks | sed -n '/^iOS SDKs:/,/^iOS Simulator SDKs:/p'
              return 0
            fi

            echo "::notice::Installing Xcode iOS platform"
            if ! retry xcodebuild -downloadPlatform iOS; then
              retry sudo env DEVELOPER_DIR="$DEVELOPER_DIR" \
                xcodebuild -downloadPlatform iOS
            fi

            if ! xcodebuild -showsdks | grep -qE '^[[:space:]]+iOS '; then
              echo "::error::iOS SDK is still unavailable after platform installation"
              return 1
            fi

            xcodebuild -showsdks | sed -n '/^iOS SDKs:/,/^iOS Simulator SDKs:/p'
          }

          ensure_ios_platform

          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.postBuffer 524288000

          # Premake embeds the pinned data repositories into the iOS targets.
          ./xenia-build.py fetchdata

          # Remove any stale premake5 binary left in the submodule tree by
          # a previous cache run.  premake.py checks this path first and
          # would use an outdated binary that doesn't support --os=ios.
          rm -f third_party/premake-core/bin/release/premake5

          # Build premake5 as a macOS host tool if not cached, then generate
          # iOS project files.
          mkdir -p tools/build/bin
          if [ '${{ steps.cache-premake5.outputs.cache-hit }}' != 'true' ]; then
            repo_root="$PWD"
            premake_core_dir="third_party/premake-core"
            if [ ! -f "${premake_core_dir}/Bootstrap.mak" ] && git -C "${premake_core_dir}" rev-parse --git-dir >/dev/null 2>&1; then
              git -C "${premake_core_dir}" reset --hard HEAD
            fi
            if [ ! -f "${premake_core_dir}/Bootstrap.mak" ]; then
              echo "::warning::premake-core worktree is incomplete; cloning fallback source"
              premake_core_dir="$(mktemp -d "${TMPDIR:-/tmp}/premake-core.XXXXXX")"
              retry git clone --depth=1 --branch v5.0.0-beta7 https://github.com/premake/premake-core.git "${premake_core_dir}"
            fi
            # Build premake5 from source (host macOS binary).
            cd "${premake_core_dir}"
            make -f Bootstrap.mak PLATFORM=ARM64 osx
            cd "${repo_root}"
            cp "${premake_core_dir}/bin/release/premake5" tools/build/bin/
            chmod +x tools/build/bin/premake5
            echo "premake5 built and copied to tools/build/bin/"
          else
            echo "premake5 restored from cache"
          fi
          # Verify premake5 is usable before proceeding.
          if [ ! -x tools/build/bin/premake5 ]; then
            echo "ERROR: tools/build/bin/premake5 not found or not executable"
            ls -la tools/build/bin/ || true
            exit 1
          fi
          tools/build/bin/premake5 --version

          # Create a sentinel file so premake Lua scripts can reliably
          # detect an iOS build when xb build runs premake.
          touch .ios_target

      - name: Build
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 16.0
        run: |
          # Build the full iOS app target (no code signing on CI).
          ./xenia-build.py build --config=Release --target_os=ios -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_IDENTITY= \
            IPHONEOS_DEPLOYMENT_TARGET=${IPHONEOS_DEPLOYMENT_TARGET}

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          app_bundle="$(find build/bin/iOS-ARM64/Release -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::iOS app bundle not found in build/bin/iOS-ARM64/Release"
            exit 1
          fi

          ./tools/build_apple_release.sh --platform ios --stamp-bundle "$app_bundle"

          xattr -cr "$app_bundle"
          if ! codesign --force --sign - --timestamp=none --entitlements xenia_ios.entitlements "$app_bundle"; then
            echo "::warning::Ad-hoc signing failed; packaging unsigned app bundle"
          fi

          mkdir -p artifacts/release
          ipa_out="$PWD/artifacts/release/xenios.ipa"
          tmp="$(mktemp -d "${TMPDIR:-/tmp}/xenios_ci_ipa.XXXXXX")"
          mkdir -p "$tmp/Payload"
          ditto "$app_bundle" "$tmp/Payload/$(basename "$app_bundle")"
          (
            cd "$tmp"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_out"
          )
          rm -rf "$tmp"

      - name: Upload iOS ARM64 artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: xenios_ipa
          path: artifacts/release/xenios.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish-ios-release:
    name: Publish iOS Release Asset
    needs: build-ios-arm64
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: xenios_ipa
          path: artifacts/release

      - name: Create or update rolling iOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="main-ios-latest"
          title="main iOS latest"

          {
            printf 'Rolling iOS build from `main`.\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Workflow: `%s`\n' "${GITHUB_WORKFLOW}"
            printf -- '- Run: `%s`\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload "${tag}" artifacts/release/xenios.ipa --clobber
